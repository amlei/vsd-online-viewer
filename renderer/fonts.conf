# Font substitution + metrics for vsd2svg.
#
# Format (tab separated, "#" starts a comment):
#   <Visio font name>	<ascii em fraction>	<other em fraction>	<ascent em>	<line gap em>	<CSS font stack>
#
# Visio files only store font *names*.  Wrapping, centring and baseline
# placement depend on the metrics, so each family carries its own numbers and
# the CSS stack that the browser will actually use.
#
# CJK engineering fonts of this drawing set are half width for ASCII, full
# width (1 em) for everything else, with the usual 0.88 em ascent of SongTi.

# --- 宋体 family -----------------------------------------------------------
宋体	0.5	1.0	0.88	0.0	Songti SC, STSong, SimSun, serif
@宋体	0.5	1.0	0.88	0.0	Songti SC, STSong, SimSun, serif
SimSun	0.5	1.0	0.88	0.0	Songti SC, STSong, SimSun, serif
@SimSun	0.5	1.0	0.88	0.0	Songti SC, STSong, SimSun, serif
新宋体	0.5	1.0	0.88	0.0	Songti SC, STSong, NSimSun, serif
NSimSun	0.5	1.0	0.88	0.0	Songti SC, STSong, NSimSun, serif

# --- 仿宋 family -----------------------------------------------------------
仿宋	0.5	1.0	0.88	0.0	STFangsong, FangSong, Songti SC, serif
仿宋_GB2312	0.5	1.0	0.88	0.0	STFangsong, FangSong, Songti SC, serif
FangSong	0.5	1.0	0.88	0.0	STFangsong, FangSong, Songti SC, serif
FangSong_GB2312	0.5	1.0	0.88	0.0	STFangsong, FangSong, Songti SC, serif

# --- 黑体 family -----------------------------------------------------------
黑体	0.5	1.0	0.88	0.0	Heiti SC, STHeiti, SimHei, sans-serif
SimHei	0.5	1.0	0.88	0.0	Heiti SC, STHeiti, SimHei, sans-serif
微软雅黑	0.5	1.0	0.88	0.0	Microsoft YaHei, PingFang SC, sans-serif
Microsoft YaHei	0.5	1.0	0.88	0.0	Microsoft YaHei, PingFang SC, sans-serif

# --- 楷体 family -----------------------------------------------------------
楷体	0.5	1.0	0.88	0.0	Kaiti SC, STKaiti, KaiTi, serif
楷体_GB2312	0.5	1.0	0.88	0.0	Kaiti SC, STKaiti, KaiTi, serif
KaiTi	0.5	1.0	0.88	0.0	Kaiti SC, STKaiti, KaiTi, serif

# --- latin -----------------------------------------------------------------
# Windows font linking renders CJK text that is assigned a latin font with the
# system CJK font, so every stack keeps a CJK fallback at the end.
Times New Roman	0.5	1.0	0.9	0.0	Times New Roman, Times, Songti SC, serif
Arial	0.5	1.0	0.9	0.0	Arial, Helvetica, Songti SC, sans-serif
Calibri	0.48	0.9	0.9	0.0	Calibri, Carlito, Songti SC, sans-serif

# --- 行楷 family -----------------------------------------------------------
华文行楷	0.5	1.0	0.88	0.0	Xingkai SC, STXingkai, Kaiti SC, serif
STXingkai	0.5	1.0	0.88	0.0	Xingkai SC, STXingkai, Kaiti SC, serif

# --- default for everything else -------------------------------------------
*	0.5	1.0	0.88	0.0	
